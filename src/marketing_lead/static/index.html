<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lead Finder</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c2733;
        --muted: #647386;
        --line: #d8dee8;
        --surface: #ffffff;
        --bg: #f4f6f8;
        --blue: #2563eb;
        --green: #0f8f6f;
        --amber: #a16207;
        --red: #b42318;
        --tag: #eef2f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.45;
      }

      header {
        background: #ffffff;
        border-bottom: 1px solid var(--line);
      }

      .shell {
        width: min(1440px, calc(100vw - 32px));
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 64px;
        gap: 20px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }

      .subtle {
        color: var(--muted);
        font-size: 13px;
      }

      main {
        padding: 22px 0 36px;
      }

      .search-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        display: grid;
        grid-template-columns: 120px 120px 120px minmax(180px, 1fr) auto;
        gap: 12px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        color: #334155;
        font-size: 12px;
        font-weight: 650;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        height: 38px;
        border: 1px solid #c8d1df;
        border-radius: 6px;
        padding: 0 10px;
        color: var(--ink);
        font: inherit;
        background: #fff;
      }

      .checks {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
        min-height: 38px;
      }

      .check {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #334155;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }

      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      button,
      .button-link {
        height: 38px;
        border: 1px solid #1d4ed8;
        border-radius: 6px;
        padding: 0 14px;
        background: var(--blue);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        white-space: nowrap;
      }

      button.secondary,
      .button-link.secondary {
        background: #fff;
        color: #1d4ed8;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .button-link.disabled {
        border-color: #c8d1df;
        color: #7b8796;
        background: #eef2f7;
        cursor: not-allowed;
        pointer-events: none;
      }

      .status-line {
        min-height: 24px;
        margin: 12px 0;
        color: var(--muted);
      }

      .status-line.error {
        color: var(--red);
        font-weight: 700;
      }

      .progress-wrap {
        display: grid;
        gap: 8px;
        margin: 12px 0;
      }

      .progress-track {
        width: 100%;
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: #dce3ee;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--green);
        transition: width 180ms ease;
      }

      .progress-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 12px;
        margin: 12px 0;
      }

      .metric,
      .source-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }

      .metric strong {
        display: block;
        font-size: 24px;
        line-height: 1.1;
      }

      .metric span,
      .source-card span {
        color: var(--muted);
        font-size: 12px;
      }

      .sources {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 12px 0;
      }

      .source-card {
        display: grid;
        gap: 8px;
      }

      .source-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .source-head strong {
        font-size: 14px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--tag);
        color: #334155;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.ok {
        background: #e7f7f1;
        color: #047857;
      }

      .badge.error {
        background: #fee4e2;
        color: var(--red);
      }

      .table-wrap {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: auto;
      }

      table {
        width: 100%;
        min-width: 1560px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 11px 12px;
        border-bottom: 1px solid #e6ebf2;
        text-align: left;
        vertical-align: top;
      }

      th {
        position: sticky;
        top: 0;
        background: #f9fafb;
        color: #475569;
        font-size: 12px;
        font-weight: 800;
        z-index: 1;
      }

      td {
        color: #263241;
      }

      .name-cell strong {
        display: block;
        max-width: 240px;
        overflow-wrap: anywhere;
      }

      .address {
        max-width: 260px;
        color: #334155;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        max-width: 280px;
      }

      .score {
        min-width: 46px;
        justify-content: center;
      }

      .score.high {
        background: #e7f7f1;
        color: var(--green);
      }

      .score.mid {
        background: #fff4d6;
        color: var(--amber);
      }

      .score.low {
        background: #eef2f7;
        color: #475569;
      }

      .empty {
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .search-panel {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .actions {
          justify-content: flex-start;
        }

        .summary,
        .sources {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100vw - 20px, 1440px);
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
          padding: 14px 0;
          gap: 4px;
        }

        .search-panel,
        .summary,
        .sources {
          grid-template-columns: 1fr;
        }

        .actions {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell topbar">
        <div>
          <h1>Lead Finder</h1>
          <div class="subtle">Free-source discovery and validation for foodservice, grocery, and restaurant leads.</div>
        </div>
        <div class="subtle" id="locationLabel"></div>
      </div>
    </header>

    <main class="shell">
      <form class="search-panel" id="searchForm">
        <label>
          ZIP code
          <input id="zipInput" name="zip" type="text" inputmode="numeric" maxlength="5" value="90012" required />
        </label>
        <label>
          Radius mi
          <input id="radiusInput" name="radius_mi" type="number" min="0.1" max="50" step="0.1" value="1" required />
        </label>
        <label>
          Limit
          <input id="limitInput" name="limit" type="number" min="0" max="2000" step="1" value="150" />
        </label>
        <div class="checks">
          <label class="check"><input id="abcInput" type="checkbox" checked /> CA ABC licenses</label>
          <label class="check"><input id="llmInput" type="checkbox" /> Ollama + web verification</label>
          <label>
            LLM model
            <input id="llmModelInput" type="text" value="kimi-k2.6:cloud" />
          </label>
        </div>
        <div class="actions">
          <button id="searchButton" type="submit">Search</button>
          <a id="exportLink" class="button-link secondary" href="#">CSV</a>
        </div>
      </form>

      <div id="statusLine" class="status-line">Enter a ZIP code and run a search.</div>
      <section class="progress-wrap" aria-label="Search progress">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-meta" id="progressMeta">Idle.</div>
      </section>

      <section class="summary" id="summary"></section>
      <section class="sources" id="sources"></section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Score</th>
              <th>Status</th>
              <th>Lead</th>
              <th>Category</th>
              <th>Address</th>
              <th>Customer</th>
              <th>Sources</th>
              <th>Signals</th>
              <th>Warnings</th>
              <th>Verification</th>
              <th>LLM Notes</th>
            </tr>
          </thead>
          <tbody id="leadRows">
            <tr><td colspan="11" class="empty">No search has been run.</td></tr>
          </tbody>
        </table>
      </section>
    </main>

    <script>
      const form = document.getElementById("searchForm");
      const statusLine = document.getElementById("statusLine");
      const summary = document.getElementById("summary");
      const sources = document.getElementById("sources");
      const leadRows = document.getElementById("leadRows");
      const exportLink = document.getElementById("exportLink");
      const searchButton = document.getElementById("searchButton");
      const locationLabel = document.getElementById("locationLabel");
      const progressFill = document.getElementById("progressFill");
      const progressMeta = document.getElementById("progressMeta");
      let currentJobId = "";
      let pollTimer = null;

      disableExport();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        await runSearch();
      });

      exportLink.addEventListener("click", (event) => {
        if (exportLink.classList.contains("disabled")) {
          event.preventDefault();
        }
      });

      async function runSearch() {
        setBusy(true);
        disableExport();
        if (pollTimer) window.clearTimeout(pollTimer);
        statusLine.className = "status-line";
        statusLine.textContent = "Starting search job...";
        setProgress(0, "Queued.");
        summary.innerHTML = "";
        sources.innerHTML = "";
        leadRows.innerHTML = `<tr><td colspan="11" class="empty">Search is running.</td></tr>`;

        try {
          const response = await fetch("/api/search-jobs", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: buildParams().toString(),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "Search failed");
          currentJobId = payload.id;
          updateJobStatus(payload);
          await pollJob();
        } catch (error) {
          statusLine.className = "status-line error";
          statusLine.textContent = error.message;
          leadRows.innerHTML = `<tr><td colspan="11" class="empty">Search failed.</td></tr>`;
          setBusy(false);
        }
      }

      async function pollJob() {
        if (!currentJobId) return;
        try {
          const response = await fetch(`/api/search-jobs/${currentJobId}`);
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "Search failed");
          updateJobStatus(payload);
          if (payload.status === "completed") {
            render(payload.result);
            statusLine.className = "status-line";
            statusLine.textContent = `Found ${payload.result.summary.lead_count} scored leads.`;
            enableExport(`/api/search-jobs/${currentJobId}/export.csv`);
            setBusy(false);
            return;
          }
          if (payload.status === "failed") {
            throw new Error(payload.error || payload.message || "Search failed");
          }
          pollTimer = window.setTimeout(pollJob, 900);
        } catch (error) {
          statusLine.className = "status-line error";
          statusLine.textContent = error.message;
          leadRows.innerHTML = `<tr><td colspan="11" class="empty">Search failed.</td></tr>`;
          setBusy(false);
        }
      }

      function updateJobStatus(payload) {
        setProgress(payload.progress || 0, payload.message || "Working...");
        const leadText = payload.current_lead ? ` · ${payload.current_lead}` : "";
        statusLine.textContent = `${payload.stage || "working"}: ${payload.message || ""}${leadText}`;
      }

      function setProgress(value, label) {
        const pct = Math.max(0, Math.min(100, Number(value) || 0));
        progressFill.style.width = `${pct}%`;
        progressMeta.textContent = `${pct}% · ${label}`;
      }

      function buildParams() {
        return new URLSearchParams({
          zip: document.getElementById("zipInput").value.trim(),
          radius_mi: document.getElementById("radiusInput").value,
          limit: document.getElementById("limitInput").value,
          include_abc: document.getElementById("abcInput").checked ? "true" : "false",
          include_llm: document.getElementById("llmInput").checked ? "true" : "false",
          llm_model: document.getElementById("llmModelInput").value.trim() || "kimi-k2.6:cloud",
          llm_limit: "0",
        });
      }

      function render(payload) {
        const loc = payload.location;
        locationLabel.textContent = `ZIP ${payload.zip_code} center: ${loc.latitude.toFixed(5)}, ${loc.longitude.toFixed(5)}`;
        renderSummary(payload.summary);
        renderSources(payload.source_reports);
        renderRows(payload.leads);
      }

      function renderSummary(data) {
        const cards = [
          ["Leads", data.lead_count],
          ["Multi-source", data.multi_source_count],
          ["Merged duplicates", data.merged_count],
          ["High score", data.high_score_count],
          ["Review first", data.review_first_count],
          ["Existing customers", data.existing_customer_count || 0],
        ];
        summary.innerHTML = cards.map(([label, value]) => `
          <article class="metric">
            <strong>${escapeHtml(String(value))}</strong>
            <span>${escapeHtml(label)}</span>
          </article>
        `).join("");
      }

      function renderSources(items) {
        sources.innerHTML = items.map((source) => `
          <article class="source-card">
            <div class="source-head">
              <strong>${escapeHtml(source.label)}</strong>
              <span class="badge ${source.status === "ok" ? "ok" : "error"}">${escapeHtml(source.status)} · ${source.count}</span>
            </div>
            <span>${escapeHtml(source.detail || "")}</span>
          </article>
        `).join("");
      }

      function renderRows(leads) {
        if (!leads.length) {
          leadRows.innerHTML = `<tr><td colspan="11" class="empty">No leads matched the search.</td></tr>`;
          return;
        }

        leadRows.innerHTML = leads.map((lead) => {
          const scoreClass = lead.confidence_score >= 80 ? "high" : lead.confidence_score >= 65 ? "mid" : "low";
          const address = [lead.address_1, lead.city, lead.state, lead.postcode].filter(Boolean).join(", ");
          return `
            <tr>
              <td><span class="badge score ${scoreClass}">${lead.confidence_score}</span></td>
              <td><span class="badge">${escapeHtml(lead.lead_status || "new_lead")}</span></td>
              <td class="name-cell">
                <strong>${escapeHtml(lead.name || "Unnamed lead")}</strong>
                <span class="subtle">${escapeHtml(lead.phone || "")}</span>
              </td>
              <td>${escapeHtml(lead.category || "")}</td>
              <td class="address">${escapeHtml(address || "No street address")}</td>
              <td>
                <strong>${escapeHtml(lead.customer_id || "")}</strong>
                <div class="subtle">${escapeHtml([lead.customer_status, lead.customer_branch].filter(Boolean).join(" · "))}</div>
                <div class="subtle">${escapeHtml(lead.customer_last_shopped || lead.customer_last_visit || "")}</div>
              </td>
              <td><div class="tags">${badges(splitTags(lead.source))}</div></td>
              <td><div class="tags">${badges(splitTags(lead.signals))}</div></td>
              <td><div class="tags">${badges(splitTags(lead.warnings))}</div></td>
              <td>
                ${escapeHtml(lead.verification_summary || "")}
                <div class="tags">${badges(splitTags(lead.verification_sources))}</div>
              </td>
              <td>${escapeHtml(lead.llm_notes || "")}</td>
            </tr>
          `;
        }).join("");
      }

      function splitTags(value) {
        return String(value || "").split(";").map((item) => item.trim()).filter(Boolean);
      }

      function badges(items) {
        return items.map((item) => `<span class="badge">${escapeHtml(item)}</span>`).join("");
      }

      function setBusy(isBusy) {
        searchButton.disabled = isBusy;
        searchButton.textContent = isBusy ? "Searching" : "Search";
      }

      function disableExport() {
        exportLink.classList.add("disabled");
        exportLink.href = "#";
        exportLink.setAttribute("aria-disabled", "true");
      }

      function enableExport(href) {
        exportLink.classList.remove("disabled");
        exportLink.href = href;
        exportLink.setAttribute("aria-disabled", "false");
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#039;",
        }[char]));
      }
    </script>
  </body>
</html>
